name: Content OS — Supabase deploy

# Applies pending migrations AND deploys the Edge Functions to the remote project
# whenever supabase/** lands on main (a merge, or a direct commit — Davide works on
# main). ONE ordered job: `db push` THEN `functions deploy`, so a function that calls
# a new RPC (e.g. capture-mcp → spawn_piece) never ships ahead of the migration that
# creates it. Both are idempotent — `db push` is a no-op with no new migrations, and a
# re-deploy just replaces the function — so running both on any supabase/** change is safe.
#
# Deliberately NOT the Supabase GitHub integration: that bundles preview branches per PR,
# which don't fit a commit-to-main, no-branches solo workflow, and would be a second path
# applying the schema. This is plain CI over the CLI we already use.
#
# Secrets required (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (dashboard → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password (set at project creation)
#   SUPABASE_PROJECT_ID    — the project ref (dashboard URL / Settings → General → Reference ID)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}   # manual re-apply / re-deploy

permissions:
  contents: read

concurrency:
  group: contentos-supabase
  cancel-in-progress: false   # never interrupt a migration mid-apply

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1   # pinned to match mise.toml

      - name: Apply migrations, then deploy functions (in order)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push
          # verify_jwt is set per-function in config.toml, so no flag is needed here.
          supabase functions deploy
