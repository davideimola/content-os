name: Content OS Beats

# The three Beats run here (GitHub Actions cron), not as native Claude routines: the routines'
# cloud env proxies GitHub access and cannot reach Projects v2 (the Calendar board). An Actions
# runner has full GitHub + internet egress.
#
# Architecture is SEPARATED (ADR-0003 hands/brain): each scripts/beats/<beat>.sh does
#   GATHER (deterministic gh) -> DECIDE (one Gemini REST call, JSON mode, non-agentic) -> APPLY
#   (deterministic gh + contentos). The model is a pure function state->decisions; all side effects
#   (labels, board, Telegram) are deterministic bash. No agent tool-loop.
# See docs/agents/beat-scheduling.md and docs/research/zero-cost-agentic-ci.md.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday planning  — 06:00 UTC (~08:00 Europe/Rome, summer)
    - cron: "0 6 * * 4"   # Thursday guard   — 06:00 UTC
    - cron: "0 6 1 * *"   # Monthly review   — 1st of month, 06:00 UTC
  workflow_dispatch:
    inputs:
      beat:
        description: Which Beat to run (manual test)
        type: choice
        options: [monday, thursday, monthly]
        default: monday

permissions:
  contents: read

concurrency:
  group: contentos-beats
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build contentos onto PATH
        run: |
          go build -o "$HOME/.local/bin/contentos" ./cmd/contentos
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select the Beat (from the cron that fired, or the manual input)
        id: sel
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1") beat=monday ;;
            "0 6 * * 4") beat=thursday ;;
            "0 6 1 * *") beat=monthly ;;
            *)           beat="${{ github.event.inputs.beat }}"; beat="${beat:-monday}" ;;
          esac
          echo "beat=$beat" >> "$GITHUB_OUTPUT"
          echo "Running the $beat Beat"

      - name: Prereq smoke check (deterministic — surfaces auth/board issues in the log)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PROJECT_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "go:        $(go version)"
          echo "gh:        $(gh --version | head -1)"
          echo "contentos: $(command -v contentos || echo MISSING)"
          echo "GEMINI_API_KEY set: ${GEMINI_API_KEY:+yes}${GEMINI_API_KEY:-NO}"
          echo "TELEGRAM_BOT_TOKEN set: ${TELEGRAM_BOT_TOKEN:+yes}${TELEGRAM_BOT_TOKEN:-NO}"
          echo "TELEGRAM_CHAT_ID set:   ${TELEGRAM_CHAT_ID:+yes}${TELEGRAM_CHAT_ID:-NO}"
          echo "--- gh auth status ---"; gh auth status || true
          echo "--- gh project view 2 (the board) ---"; gh project view 2 --owner davideimola --format json --jq '.title' || echo "PROJECT ACCESS FAILED"
        continue-on-error: true

      - name: Run the Beat (separated — gather · decide · apply)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PROJECT_PAT }}          # gh reads it; PAT has repo + project
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash "scripts/beats/${{ steps.sel.outputs.beat }}.sh" run
